<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>🔐 SECRET GIFT TERMINAL</title>
    <!--
    ╔══════════════════════════════════════════════════════════════════╗
    ║           赛博朋克生日贺卡 - Cyberpunk Birthday Card             ║
    ║                    By VibeCoding Generator                       ║
    ╚══════════════════════════════════════════════════════════════════╝
    -->

    <!-- Google Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- 外部样式表 -->
    <link rel="stylesheet" href="styles.css">

    <!-- 从太空回忆录返回时：立刻隐藏启动页，避免开机动画闪现一帧 -->
    <script>
        (function () {
            try {
                if (sessionStorage.getItem('birthday.skipBoot') !== '1') return;
                var style = document.createElement('style');
                style.textContent = '#boot-screen{display:none!important}';
                document.head.appendChild(style);
            } catch (err) { /* 隐私模式下忽略 */ }
        })();
    </script>
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════════
         Canvas背景层 - 粒子效果
         ═══════════════════════════════════════════════════════════════ -->
    <canvas id="particle-canvas"></canvas>

    <!-- ═══════════════════════════════════════════════════════════════
         Matrix数字雨Canvas
         ═══════════════════════════════════════════════════════════════ -->
    <canvas id="matrix-canvas"></canvas>

    <!-- ═══════════════════════════════════════════════════════════════
         扫描线效果层
         ═══════════════════════════════════════════════════════════════ -->
    <div class="scanlines" id="scanlines"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         弹幕容器
         ═══════════════════════════════════════════════════════════════ -->
    <div class="danmaku-container" id="danmaku-container"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         阶段1: 启动加载页
         ═══════════════════════════════════════════════════════════════ -->
    <div class="boot-screen" id="boot-screen">
        <div class="boot-content" id="boot-texts"></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0%</div>
        <div class="press-key hidden" id="press-key">[ PRESS ANY KEY / CLICK TO UNLOCK ]</div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         阶段2: 主内容区
         ═══════════════════════════════════════════════════════════════ -->
    <div class="main-content" id="main-content">
        <div class="terminal-card">
            <!-- 标题 -->
            <div class="title-container">
                <h1 class="main-title" id="main-title">HAPPY BIRTHDAY</h1>
            </div>

            <!-- 祝福语区域 -->
            <div class="wishes-container" id="wishes-container"></div>

            <!-- 交互按钮 -->
            <div class="buttons-container">
                <button class="cyber-btn" id="btn-gallery">📸 打开记忆相册</button>
                <button class="cyber-btn" id="btn-danmaku">🎊 赛博弹幕雨</button>
                <button class="cyber-btn" id="btn-milktea">🧋 小宝喝奶茶</button>
            </div>
        </div>

        <!-- 底部签名 -->
        <div class="footer-signature">
            this cyber gift made for you ♡
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         阶段3: 图片画廊弹窗
         ═══════════════════════════════════════════════════════════════ -->
    <div class="gallery-modal" id="gallery-modal">
        <div class="gallery-container">
            <div class="gallery-title">>> MEMORY GALLERY <<</div>
            <div class="gallery-image" id="gallery-image">
                <!-- 此处替换为照片 - 使用SVG占位 -->
                <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="200" height="200" fill="#0d0d1a"/>
                    <circle cx="100" cy="80" r="40" fill="#22d3ee" opacity="0.3"/>
                    <rect x="50" y="130" width="100" height="50" rx="5" fill="#ff4dd2" opacity="0.3"/>
                    <text x="100" y="195" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="monospace">
                        [照片位置 1/3]
                    </text>
                </svg>
            </div>
            <div class="gallery-nav">
                <button class="cyber-btn" id="gallery-prev">◄ 上一张</button>
                <button class="cyber-btn" id="gallery-next">下一张 ►</button>
            </div>
            <button class="cyber-btn gallery-close" id="gallery-close">关闭画廊</button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         奶茶祝福弹窗
         ═══════════════════════════════════════════════════════════════ -->
    <div class="milktea-modal" id="milktea-modal" role="dialog" aria-modal="true" aria-labelledby="milktea-title">
        <div class="milktea-card">
            <div class="milktea-sticker" aria-hidden="true">🧋🎂</div>
            <div class="milktea-title" id="milktea-title">>> MILK TEA PROTOCOL <<</div>
            <p class="milktea-message">生日就是要大口喝奶茶大口吃蛋糕，长胖什么的就留给明天的自己吧！</p>
            <div class="milktea-redpacket">
                <span class="milktea-redpacket-label">口令红包：</span>
                <span class="milktea-redpacket-code" id="milktea-code">（先空出来）</span>
            </div>
            <button class="cyber-btn milktea-close" id="milktea-close">收下奶茶</button>
        </div>
    </div>

    <!-- 外部脚本 -->
    <script src="script.js"></script>
</body>
</html>
